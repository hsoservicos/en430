; php-security.ini — hardening do PHP em produção (EN_430)
; Copiado para /usr/local/etc/php/conf.d/ pelo Dockerfile.
; Não altera limites de upload/memória: apenas reduz superfície e vazamento.

; Não anunciar a versão do PHP no header X-Powered-By
expose_php = Off

; Erros vão para o log (stderr), nunca para o usuário
display_errors = Off
display_startup_errors = Off
html_errors = Off
log_errors = On
error_log = /dev/stderr

; Sessão: cookie inacessível a JavaScript e sem IDs não inicializados
; (sid_length/sid_bits_per_character são depreciados no PHP 8.4)
session.cookie_httponly = 1
session.use_only_cookies = 1
session.use_strict_mode = 1

; Vetor usado nas falhas de sessão de novembro/2026 (CVE-2026-115560)
session.upload_progress.enabled = 0

; Sem inclusão de arquivos remotos
allow_url_include = Off
